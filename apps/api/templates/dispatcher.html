<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <title>GreenLogix dispatcher</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    #map { height: 480px; margin-top: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    #totals { margin-top: 8px; }
  </style>
</head>
<body>
  <h1>GreenLogix dispatcher</h1>
  <div class="row">
    <button id="btn-seed" type="button">Seed</button>
    <button id="btn-optimize" type="button">Optimize</button>
    <button id="btn-publish" type="button">Publish</button>
    <button id="btn-refresh" type="button">Refresh</button>
    <form id="import-form">
      <input id="xlsx" type="file" name="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"/>
      <button type="submit">Upload xlsx</button>
    </form>
  </div>
  <div id="totals">km: <span id="km">0</span> · litres: <span id="litres">0</span> · kg_co2: <span id="kg_co2">0</span></div>
  <section id="report-strip">
    <h2>ước tính TTW CO₂ (IPCC/GLEC factors)</h2>
    <table>
      <thead><tr><th></th><th>km</th><th>litres</th><th>kg_co2</th></tr></thead>
      <tbody>
        <tr><th>Trước</th><td id="base-km">0</td><td id="base-litres">0</td><td id="base-co2">0</td></tr>
        <tr><th>Sau</th><td id="opt-km">0</td><td id="opt-litres">0</td><td id="opt-co2">0</td></tr>
        <tr><th>Δ %</th><td id="pct-km">0</td><td id="pct-litres">0</td><td id="pct-co2">0</td></tr>
      </tbody>
    </table>
  </section>
  <p id="status"></p>
  <ul id="import-errors"></ul>
  <h2>Orders</h2>
  <table id="orders"><thead><tr><th>id</th><th>address</th><th>kg</th><th>window</th><th>notes</th><th></th></tr></thead><tbody></tbody></table>
  <h2>Vehicles</h2>
  <table id="vehicles"><thead><tr><th>plate</th><th>capacity_kg</th><th>status</th></tr></thead><tbody></tbody></table>
  <h2>Stops</h2>
  <ul id="route-stops"></ul>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script>
    const AUTH = { "Authorization": "Bearer DEMO" };
    const map = L.map("map").setView([10.776, 106.700], 12);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    let polylines = [];

    function setStatus(text) { document.getElementById("status").textContent = text; }
    function setTotals(t) {
      const tot = t || { km: 0, litres: 0, kg_co2: 0 };
      document.getElementById("km").textContent = Number(tot.km).toFixed(2);
      document.getElementById("litres").textContent = Number(tot.litres).toFixed(2);
      document.getElementById("kg_co2").textContent = Number(tot.kg_co2).toFixed(2);
    }
    function num(v) { return Number(v || 0).toFixed(2); }
    async function refreshReport() {
      const r = await api("/report");
      const b = r.baseline || {};
      const o = r.optimized || {};
      const d = r.delta || {};
      document.getElementById("base-km").textContent = num(b.km);
      document.getElementById("base-litres").textContent = num(b.litres);
      document.getElementById("base-co2").textContent = num(b.kg_co2);
      document.getElementById("opt-km").textContent = num(o.km);
      document.getElementById("opt-litres").textContent = num(o.litres);
      document.getElementById("opt-co2").textContent = num(o.kg_co2);
      document.getElementById("pct-km").textContent = num(d.km_pct);
      document.getElementById("pct-litres").textContent = num(d.litres_pct);
      document.getElementById("pct-co2").textContent = num(d.kg_co2_pct);
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }
    function drawRoutes(routes) {
      polylines.forEach((p) => map.removeLayer(p));
      polylines = [];
      for (const route of routes || []) {
        const latlngs = (route.stops || []).map((s) => [s.lat, s.lng]);
        if (latlngs.length) {
          polylines.push(L.polyline(latlngs, { color: route.color || "blue" }).addTo(map));
        }
      }
    }
    function renderStopStatus(routes) {
      const ul = document.getElementById("route-stops");
      ul.innerHTML = "";
      for (const route of routes || []) {
        for (const stop of route.stops || []) {
          const li = document.createElement("li");
          li.textContent = (stop.address || "") + " — " + (stop.status || "");
          ul.appendChild(li);
        }
      }
    }
    async function refreshRoutes() {
      const routes = await api("/routes");
      drawRoutes(routes);
      renderStopStatus(routes);
      return routes;
    }
    async function api(path, opts) {
      const res = await fetch(path, Object.assign({ headers: Object.assign({ "Content-Type": "application/json" }, AUTH) }, opts || {}));
      if (!res.ok) throw new Error(path + " " + res.status);
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("application/json")) return res.json();
      return res.text();
    }
    document.getElementById("btn-seed").onclick = async () => {
      try {
        const body = await api("/seed", { method: "POST" });
        setStatus("seeded orders=" + body.orders + " vehicles=" + body.vehicles);
      } catch (err) { setStatus(String(err)); }
    };
    document.getElementById("btn-optimize").onclick = async () => {
      try {
        const body = await api("/optimize", { method: "POST", body: JSON.stringify({ cluster_radius_km: 3.0 }) });
        setTotals(body.totals);
        await refreshRoutes();
        await refreshReport();
        setStatus("optimized routes=" + (body.routes || []).length);
      } catch (err) { setStatus(String(err)); }
    };
    document.getElementById("btn-publish").onclick = async () => {
      try {
        const body = await api("/routes/publish", { method: "POST", body: JSON.stringify({ route_ids: [] }) });
        setStatus("published=" + (body || []).length);
      } catch (err) { setStatus(String(err)); }
    };
    document.getElementById("btn-refresh").onclick = async () => {
      try {
        await refreshRoutes();
        await refreshReport();
        setStatus("refreshed");
      } catch (err) { setStatus(String(err)); }
    };
    async function refreshTables() {
      const orders = await api("/orders");
      const ot = document.querySelector("#orders tbody");
      ot.innerHTML = "";
      for (const o of orders) {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + o.id + "</td>" +
          "<td><input data-f=\"address\" value=\"" + esc(o.address) + "\"/></td>" +
          "<td><input data-f=\"kg\" type=\"number\" value=\"" + esc(o.kg) + "\"/></td>" +
          "<td><input data-f=\"window_start\" value=\"" + esc(o.window_start) + "\"/>" +
          "<input data-f=\"window_end\" value=\"" + esc(o.window_end) + "\"/></td>" +
          "<td><input data-f=\"notes\" value=\"" + esc(o.notes) + "\"/></td>" +
          "<td><button type=\"button\" class=\"patch\">PATCH</button> " +
          "<button type=\"button\" class=\"del\">DELETE</button></td>";
        tr.querySelector(".patch").onclick = async () => {
          const payload = {};
          tr.querySelectorAll("[data-f]").forEach((el) => { payload[el.getAttribute("data-f")] = el.value; });
          payload.kg = Number(payload.kg);
          try {
            await api("/orders/" + o.id, { method: "PATCH", body: JSON.stringify(payload) });
            setStatus("patched " + o.id);
            await refreshTables();
          } catch (err) { setStatus(String(err)); }
        };
        tr.querySelector(".del").onclick = async () => {
          try {
            await api("/orders/" + o.id, { method: "DELETE" });
            setStatus("deleted " + o.id);
            await refreshTables();
          } catch (err) { setStatus(String(err)); }
        };
        ot.appendChild(tr);
      }
      const vehicles = await api("/vehicles");
      const vt = document.querySelector("#vehicles tbody");
      vt.innerHTML = "";
      for (const v of vehicles) {
        const tr = document.createElement("tr");
        const sel = document.createElement("select");
        ["ready", "maintenance"].forEach((st) => {
          const opt = document.createElement("option");
          opt.value = st; opt.textContent = st; if (v.status === st) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.onchange = async () => {
          await api("/vehicles/" + v.id, { method: "PATCH", body: JSON.stringify({ status: sel.value }) });
        };
        tr.innerHTML = "<td>" + v.plate + "</td><td>" + v.capacity_kg + "</td>";
        const td = document.createElement("td");
        td.appendChild(sel);
        tr.appendChild(td);
        vt.appendChild(tr);
      }
    }
    document.getElementById("import-form").onsubmit = async (ev) => {
      ev.preventDefault();
      const file = document.getElementById("xlsx").files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append("file", file);
      const res = await fetch("/orders/import", { method: "POST", headers: AUTH, body: fd });
      const body = await res.json();
      const ul = document.getElementById("import-errors");
      ul.innerHTML = "";
      for (const err of body.errors || []) {
        const li = document.createElement("li");
        li.textContent = "row " + err.excel_row + " " + err.field + ": " + err.message;
        ul.appendChild(li);
      }
      setStatus("imported=" + (body.imported || 0));
      await refreshTables();
    };
    refreshTables().catch(() => {});
  </script>
</body>
</html>
