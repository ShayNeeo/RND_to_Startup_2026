name: CI

on:
  pull_request:
    branches: [dev, stable]
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  stable-from-dev-only:
    name: stable PRs must come from dev
    if: github.event_name == 'pull_request' && github.base_ref == 'stable'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce head branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ] && [[ "$HEAD_REF" != fix/* ]]; then
            echo "PRs into stable must be from 'dev' (promotion) or 'fix/*' (hotfix)."
            echo "Got head: $HEAD_REF"
            exit 1
          fi

  landing:
    name: Build landing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build:landing

  api:
    name: Test and lint API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Run pytest
        working-directory: apps/api
        run: |
          uv sync --locked
          uv run --locked pytest -q
      - name: Run ruff
        working-directory: apps/api
        run: uv run --locked ruff check src tests

